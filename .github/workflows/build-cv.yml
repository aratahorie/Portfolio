name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'bio/**'
  workflow_dispatch:

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Resume_for_Frehers.tex
          working_directory: bio
          latexmk_use_lualatex: true

      - name: Copy PDF to site
        run: cp bio/Resume_for_Frehers.pdf site/public/cv/Arata_Horie.pdf

      - name: Commit updated CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/cv/Arata_Horie.pdf
          git diff --staged --quiet || git commit -m "chore: update CV PDF [automated]"
          git push
